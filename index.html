<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ImpactPulse - Local Headlines. Real Action. Instant Impact.</title>
    <meta name="description" content="Local Headlines. Real Action. Instant Impact. Gamified civic action platform transforming local news into verified community impact." />
    <meta property="og:title" content="ImpactPulse - Local Headlines. Real Action. Instant Impact." />
    <meta property="og:description" content="Local Headlines. Real Action. Instant Impact. Gamified civic action platform transforming local news into verified community impact." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('impactpulse_theme');
          var isDark = saved !== null ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
